backend = "glx";

# Rounded corners
corner-radius = 0;

# Shadows disabled — purely cosmetic, removed

# Fading disabled — animations handle open/close instead
fading = false;

# Animations
animations = (
  # Normal windows opening: subtle scale + fade
  {
    triggers = ["open"];
    preset = "appear";
    duration = 0.2;
    scale = 0.95;
  },
  # Normal windows closing: subtle scale + fade
  {
    triggers = ["close"];
    preset = "disappear";
    duration = 0.15;
    scale = 0.95;
  },
  # Scratchpad (shown): slide DOWN from the top — dropdown feel
  {
    triggers = ["show"];
    preset = "slide-in";
    direction = "down";
    duration = 0.2;
  },
  # Scratchpad (hidden): slide back UP out of view
  {
    triggers = ["hide"];
    preset = "slide-out";
    direction = "up";
    duration = 0.15;
  }
);

# Opacity — all disabled, no transparency
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Vsync
vsync = true;

# GLX backend options
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
