backend = "glx";

# Rounded corners
corner-radius = 0;

# Shadows disabled — purely cosmetic, removed

# Fading disabled — animations handle open/close instead
fading = false;

# Animations — scoped to the scratchpad ONLY, so menus/tooltips/etc. never animate.
# (The scratchpad is the kitty window launched with `--name scratchpad`.)
rules = (
  {
    match = "class_i = 'scratchpad'";
    animations = (
      # Scratchpad (shown): slide DOWN from the top — dropdown feel
      {
        triggers = ["show"];
        preset = "slide-in";
        direction = "down";
        duration = 0.2;
      },
      # Scratchpad (hidden): slide back UP out of view
      {
        triggers = ["hide"];
        preset = "slide-out";
        direction = "up";
        duration = 0.15;
      }
    );
  }
);

# Opacity — fully opaque is picom's default, so no opacity options are set.
# (Old-style opacity options conflict with the "rules" block above and are
# ignored anyway; omitting them keeps every window 100% opaque — no transparency.)

# Vsync
vsync = true;

# GLX backend options
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
